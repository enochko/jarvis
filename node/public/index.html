<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #6a737d;
    --user: #1f6feb; --user-text: #ffffff; --border: #d8dee4; --error: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117; --panel: #161b22; --text: #e6edf3; --muted: #8b949e;
      --user: #1f6feb; --user-text: #ffffff; --border: #30363d; --error: #ff7b72;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  #status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  #dot.ok { background: #2da44e; }
  #dot.bad { background: var(--error); }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  .msg {
    padding: 10px 14px; border-radius: 12px; max-width: 85%;
    white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere;
  }
  .user { align-self: flex-end; background: var(--user); color: var(--user-text); }
  .bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .bot.error { color: var(--error); }
  .meta { font-size: 12px; color: var(--muted); align-self: flex-start; margin-top: -6px; }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; }
  form {
    display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); background: var(--panel);
  }
  form .wrap { flex-direction: row; width: 100%; }
  textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 200px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text);
    font: inherit;
  }
  button {
    padding: 0 18px; border: 0; border-radius: 10px; background: var(--user); color: var(--user-text);
    font: inherit; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>Jarvis</h1>
  <span id="status"><span id="dot"></span><span id="statusText">connecting…</span></span>
</header>
<main id="log"><div class="wrap" id="msgs"><p class="empty" id="empty">Ask Jarvis anything. Enter sends, Shift+Enter adds a new line.</p></div></main>
<form id="form">
  <div class="wrap">
    <textarea id="input" rows="1" placeholder="Message Jarvis…" autofocus></textarea>
    <button id="send" type="submit">Send</button>
  </div>
</form>
<script>
  const msgs = document.getElementById("msgs");
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const dot = document.getElementById("dot");
  const statusText = document.getElementById("statusText");

  function add(text, cls) {
    document.getElementById("empty")?.remove();
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;
    msgs.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  async function checkHealth() {
    try {
      const r = await fetch("/api/health");
      const ok = r.ok && (await r.json()).status === "ok";
      dot.className = ok ? "ok" : "bad";
      statusText.textContent = ok ? "agent online" : "agent offline";
    } catch {
      dot.className = "bad";
      statusText.textContent = "agent offline";
    }
  }
  checkHealth();
  setInterval(checkHealth, 15000);

  async function submit() {
    const text = input.value.trim();
    if (!text || send.disabled) return;
    add(text, "user");
    input.value = "";
    input.style.height = "";
    send.disabled = true;
    const pending = add("Thinking…", "bot");
    const started = Date.now();
    try {
      const r = await fetch("/api/message", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ text }),
      });
      const data = await r.json();
      pending.textContent = data.text ?? data.detail ?? "(no response)";
      if (!r.ok) pending.classList.add("error");
    } catch (e) {
      pending.textContent = "Could not reach Jarvis. Is it still running?";
      pending.classList.add("error");
    }
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = ((Date.now() - started) / 1000).toFixed(1) + " s";
    msgs.appendChild(meta);
    log.scrollTop = log.scrollHeight;
    send.disabled = false;
    input.focus();
  }

  document.getElementById("form").addEventListener("submit", (e) => { e.preventDefault(); submit(); });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "";
    input.style.height = Math.min(input.scrollHeight, 200) + "px";
  });
</script>
</body>
</html>
